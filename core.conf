# Core tmux settings + keybindings shared by BOTH the main server and the
# "floats" server. Sourced by tmux.conf and floats.conf so they never drift.
# Server-specific bits stay in each config: theme = status.conf; plugins live
# only in tmux.conf; the g / r / W keys are bound per-server.

set -sg escape-time 0
set -g mode-keys vi
set -g status-position bottom
set -g history-limit 2000
set -g allow-rename off
set -g automatic-rename off
set -g prefix C-s

# Pane navigation
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Pane resize
bind-key -r C-h resize-pane -L 5
bind-key -r C-j resize-pane -D 5
bind-key -r C-k resize-pane -U 5
bind-key -r C-l resize-pane -R 5

# Copy mode -> system clipboard
bind-key -T copy-mode-vi Space send-keys -X begin-selection
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"

# Open / split in current directory
bind c new-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
