# Config for the dedicated "floats" tmux server (scratch popups). Runs on its
# own socket (`-L floats`) so float sessions never clutter the main server.
# Reuses the SHARED core config + the same theme (so it looks/behaves like the
# main server), minus plugins (kept lightweight). One float session per main
# session (named to match).

# Shared core settings + keybindings — the exact same file the main server uses.
source-file ~/.config/tmux/core.conf

# Same color scheme as the main server.
source-file ~/.config/tmux/status.conf

# Float-workspace marker (after the theme, so it keeps the themed colors).
set -g status-left "#[bold] ⌁ FLOAT:#S #[bg=#262626,fg=#262626]"

# Float-specific bindings (override/extend the shared core).
bind g detach-client            # prefix g HIDES the float (main uses g to OPEN it)
bind w choose-tree -Zw          # search / jump THIS float's windows
bind r source-file ~/.config/tmux/floats.conf \; display-message "floats reloaded"
