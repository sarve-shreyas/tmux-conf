set -sg escape-time 0
set -g mode-keys vi
set-option -g status-position bottom
set -g history-limit 2000
set -g allow-rename off
set -g automatic-rename off


# Set leader
set -g prefix C-s

# Show Windows of current session only (with ✳ marker on windows running Claude)
bind W run-shell '~/.config/tmux/scripts/choose-window.sh #S'

# Setting tmux-motion keybindings
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Setting split pane resize keybindings
bind-key -r C-h resize-pane -L 5
bind-key -r C-j resize-pane -D 5
bind-key -r C-k resize-pane -U 5
bind-key -r C-l resize-pane -R 5


## Copy selection to clipboard
setw -g mode-keys vi

bind-key -T copy-mode-vi Space send-keys -X begin-selection
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"

# Setting to open/split window in cur dir
bind c new-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
# set -g @plugin 'sarve-shreyas/tmux-unique-sessions'
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'off'
set -g @continuum-save-interval '15'

# Save Claude session-ID → pane mapping after every resurrect save
set -g @resurrect-hook-post-save-all 'bash ~/.config/tmux/scripts/claude-save-sessions.sh'
# Restore Claude sessions into correct panes (runs before resurrect's own process restore)
set -g @resurrect-hook-pre-restore-pane-processes 'bash ~/.config/tmux/scripts/claude-restore-sessions.sh &'

### Sourcing tmux plugins
run '~/.tmux/plugins/tpm/tpm'

# Source color scheme (AFTER tpm so it overrides plugin status injections)
source-file ~/.config/tmux/status.conf


# Set prefix + r tmux.conf to reload the config file
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux reloaded"

