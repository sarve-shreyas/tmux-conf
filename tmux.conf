# Shared core settings + keybindings (also sourced by the floats server, so the
# two never drift). See core.conf.
source-file ~/.config/tmux/core.conf

# Show Windows of current session only (with ✳ marker on windows running Claude)
bind W run-shell '~/.config/tmux/scripts/choose-window.sh #S'

# ── Claude window-tab status. Hooks (~/.claude/settings.json) set busy/wait/clear
# live as Claude works; this reconcile corrects markers that no hook reports —
# chiefly a stale "working" dot left after <esc> interrupts Claude. Runs in the
# background on every window/session switch, so switching stays instant.
set-hook -g session-window-changed 'run-shell -b "~/.config/tmux/scripts/claude-tmux-reconcile.sh"'
set-hook -g client-session-changed 'run-shell -b "~/.config/tmux/scripts/claude-tmux-reconcile.sh"'

# ── Floating scratch popup, hosted on a SEPARATE tmux server ("floats").
# `prefix + g` opens a floating window attached to THIS session's float (a
# floats-server session named after the current main session). Run a server in
# it; hide with `prefix + g` (detaches → keeps running); reopen to reattach.
# Float sessions live on their own server, so they never clutter this one.
bind g display-popup -w 70% -h 70% -d "#{pane_current_path}" -E "~/.config/tmux/scripts/scratch-popup.sh"

# ── Claude usage: subscription limits as bars (same as nvim <leader>au).
# `prefix + u` opens a popup; r refreshes, q (any key) closes.
bind u display-popup -w 84 -h 12 -E "~/.config/tmux/scripts/claude-usage.sh"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
# set -g @plugin 'sarve-shreyas/tmux-unique-sessions'
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'off'
set -g @continuum-save-interval '15'

# Save Claude session-ID → pane mapping after every resurrect save
set -g @resurrect-hook-post-save-all 'bash ~/.config/tmux/scripts/claude-save-sessions.sh'
# Restore Claude sessions into correct panes (runs before resurrect's own process restore)
set -g @resurrect-hook-pre-restore-pane-processes 'bash ~/.config/tmux/scripts/claude-restore-sessions.sh &'

### Sourcing tmux plugins
run '~/.tmux/plugins/tpm/tpm'

# Source color scheme (AFTER tpm so it overrides plugin status injections)
source-file ~/.config/tmux/status.conf


# Set prefix + r tmux.conf to reload the config file
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux reloaded"

