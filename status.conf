set -g status on
set -g status-interval 15
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#262626,fg=#616161"
set -g message-style "fg=#353536,bg=#bbb903"

set -g status-left-length 100
set -g status-right-length 100
set -g window-status-separator ""

set -g status-left "#[bold] [tmux] #[bg=#262626,fg=#262626]"

set -g window-status-format "#[fg=#353536,bg=#262626]#[fg=#bbb903,bg=#353536] #I:#W #[fg=#353536,bg=#262626]"
set -g window-status-current-format "#[fg=#bbb903,bg=#262626,bold]#[fg=#353536,bg=#bbb903,bold] #I:#W #[fg=#bbb903,bg=#262626]"

set -g status-right "#[fg=#353536,bg=#262626]#[fg=#bbb903,bg=#353536] %H:%M  %d-%b-%y #[fg=#353536,bg=#262626] "

# Pane borders
set -g pane-border-style "fg=#353536"
set -g pane-active-border-style "fg=#bbb903"
